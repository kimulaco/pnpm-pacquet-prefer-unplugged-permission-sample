version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:24.16
    steps:
      - checkout

      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@11.7.0

      - restore_cache:
          keys:
            - pnpm-{{ checksum "pnpm-lock.yaml" }}

      - run:
          name: Install dependencies
          command: pnpm i

      - save_cache:
          key: pnpm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules

      - run:
          name: Debug esbuild binary permissions
          command: |
            echo "=== All esbuild entries in .pnpm ==="
            ls -la node_modules/.pnpm/ | grep esbuild || true

            echo ""
            echo "=== @esbuild/linux-x64 directory permissions ==="
            DIR="node_modules/.pnpm/@esbuild+linux-x64@0.25.12"
            if [ -d "$DIR" ]; then
              ls -la "$DIR"
              ls -la "$DIR/node_modules/@esbuild/linux-x64/" 2>/dev/null || echo "cannot list: permission denied"
              ls -la "$DIR/node_modules/@esbuild/linux-x64/bin/" 2>/dev/null || echo "cannot list bin/: permission denied"
              stat "$DIR/node_modules/@esbuild/linux-x64/bin/esbuild" 2>/dev/null || echo "cannot stat binary"
            else
              echo "$DIR does not exist"
            fi

            echo ""
            echo "=== esbuild JS wrapper ==="
            stat node_modules/.pnpm/esbuild@0.25.12/node_modules/esbuild/bin/esbuild 2>/dev/null || true

            echo ""
            echo "=== umask ==="
            umask

            echo ""
            echo "=== pnpm store path ==="
            pnpm store path

            echo ""
            echo "=== esbuild -exec entry in CAS (inode) ==="
            STORE=$(pnpm store path)
            find "$STORE/files" -name "*-exec" -size +9M 2>/dev/null | xargs stat 2>/dev/null | grep -E "File:|Inode:|Links:|Access:.*0[0-9]" | head -20

            echo ""
            echo "=== node_modules esbuild binary (inode) ==="
            stat node_modules/.pnpm/@esbuild+linux-x64@0.25.12/node_modules/@esbuild/linux-x64/bin/esbuild 2>/dev/null | grep -E "File:|Inode:|Links:|Access:.*0[0-9]"

            echo ""
            echo "=== preferUnplugged check ==="
            cat node_modules/.pnpm/@esbuild+linux-x64@0.25.12/node_modules/@esbuild/linux-x64/package.json 2>/dev/null | grep -E "preferUnplugged|bin"

      - run:
          name: Test
          command: pnpm test

  # 原因切り分け用ジョブ。packageImportMethod を clone / hardlink / copy / auto に
  # 固定し、それぞれで esbuild バイナリの実行ビットと pnpm test の成否を見る。
  # キャッシュは一切使わず毎回フレッシュにインストールする（restore/save_cache 無し）。
  # 期待: clone と auto は EACCES で失敗、hardlink と copy は成功。
  diagnose:
    parameters:
      import_method:
        type: string
    docker:
      - image: cimg/node:24.16
    steps:
      - checkout

      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@11.7.0

      - run:
          name: Set packageImportMethod=<< parameters.import_method >>
          command: |
            METHOD="<< parameters.import_method >>"
            # 既存の packageImportMethod 行があれば除去してから設定し直す
            grep -v '^packageImportMethod:' pnpm-workspace.yaml > ws.tmp || true
            mv ws.tmp pnpm-workspace.yaml
            # auto はデフォルトなので何も書かない（reflink が効けば clone が選ばれる）
            if [ "$METHOD" != "auto" ]; then
              printf '\npackageImportMethod: %s\n' "$METHOD" >> pnpm-workspace.yaml
            fi
            echo "----- pnpm-workspace.yaml -----"
            cat pnpm-workspace.yaml

      - run:
          name: Install dependencies (fresh, no cache)
          command: pnpm i 2>&1 | tee /tmp/install.log

      - run:
          name: Debug — import method & esbuild binary permissions
          command: |
            echo "=== 実際に使われた import method（install ログより）==="
            grep -iE "are (cloned|copied|hard linked)" /tmp/install.log || echo "(method 行が見つかりません)"

            echo ""
            echo "=== node_modules 内 esbuild バイナリ ==="
            BIN="$(find node_modules/.pnpm -path '*@esbuild+linux-x64*/bin/esbuild' 2>/dev/null | head -1)"
            if [ -n "$BIN" ] && [ -f "$BIN" ]; then
              stat -c '%A (%a) inode=%i %n' "$BIN"
              if [ -x "$BIN" ]; then
                echo "EXECUTABLE: yes (0755 系)"
              else
                echo "EXECUTABLE: NO → spawn で EACCES になる (0644)"
              fi
            else
              echo "esbuild linux-x64 バイナリが見つかりません"
            fi

            echo ""
            echo "=== CAS ストア側の -exec エントリ（正しく 0755 のはず）==="
            STORE="$(pnpm store path)"
            find "$STORE/files" -name '*-exec' -size +5M -exec stat -c '%A (%a) inode=%i %n' {} \; 2>/dev/null | head -5

            echo ""
            echo "=== umask ==="
            umask

      - run:
          name: Test (clone / auto は EACCES で失敗する想定)
          command: pnpm test

workflows:
  test:
    jobs:
      - test

  diagnose-import-methods:
    jobs:
      - diagnose:
          matrix:
            parameters:
              import_method: ["auto", "clone", "hardlink", "copy"]
